<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Re-Leaf Book</title>
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f5f4ff', 100: '#ebe9ff', 200: '#dcd8ff', 300: '#c5beff', 400: '#a79eff', 500: '#877aff', 600: '#6c63ff', 700: '#5c52e6', 800: '#4c42c2', 900: '#3e379e'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="min-h-screen flex flex-col bg-[#0F0F1A]">

    <nav id="navbar"></nav>

    <main class="flex-grow pt-24 pb-12 flex items-center justify-center px-4 relative">
        <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
            <div class="absolute -top-1/4 -left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-1/4 -right-1/4 w-96 h-96 bg-pink-500/10 rounded-full blur-3xl"></div>
        </div>

        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 glass rounded-3xl overflow-hidden border border-white/5 shadow-2xl animate-fade-in-up">
            
            <div class="hidden md:flex flex-col justify-between p-8 bg-gradient-to-br from-indigo-900/40 to-[#0F0F1A] border-r border-white/5 relative">
                <div class="flex items-center gap-2">
                    <span class="text-3xl">🍃</span>
                    <span class="text-lg font-bold text-white">Re-Leaf <span class="text-indigo-400">Book</span></span>
                </div>
                <div class="flex flex-col gap-4 my-auto">
                    <h2 class="text-3xl font-extrabold text-white leading-tight">Create your marketplace account.</h2>
                    <p class="text-sm text-indigo-200/50">Register as a customer to purchase books, or sign up as a seller to offload textbooks and make earnings.</p>
                </div>
                <p class="text-xs text-indigo-300/30">"Give Your Books a Second Life."</p>
            </div>

            <div class="p-8 flex flex-col gap-6 justify-center bg-white/3">
                <div class="text-center md:text-left">
                    <h1 class="text-2xl font-bold text-white mb-1">Get Started</h1>
                    <p class="text-xs text-indigo-200/50">Register a new profile in seconds</p>
                </div>

                <div class="grid grid-cols-2 p-1 bg-white/5 rounded-xl border border-white/5" id="reg-role-tabs">
                    <button class="py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-xl transition" id="tab-cust">Customer</button>
                    <button class="py-2 text-xs font-semibold rounded-lg text-indigo-200 hover:text-white transition" id="tab-sell">Seller</button>
                </div>

                <form id="register-form" class="flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-semibold text-indigo-200/60">Full Name</label>
                        <div class="flex items-center gap-3 glass border border-white/5 px-3 py-2 rounded-xl">
                            <i class="fas fa-user text-indigo-300/30 text-xs"></i>
                            <input type="text" id="name" required placeholder="John Doe" class="bg-transparent text-xs w-full text-white placeholder-indigo-200/20 focus:outline-none">
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-semibold text-indigo-200/60">Email Address</label>
                        <div class="flex items-center gap-3 glass border border-white/5 px-3 py-2 rounded-xl">
                            <i class="fas fa-envelope text-indigo-300/30 text-xs"></i>
                            <input type="email" id="email" required placeholder="john@domain.com" class="bg-transparent text-xs w-full text-white placeholder-indigo-200/20 focus:outline-none">
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-semibold text-indigo-200/60">Phone Number (Optional)</label>
                        <div class="flex items-center gap-3 glass border border-white/5 px-3 py-2 rounded-xl">
                            <i class="fas fa-phone text-indigo-300/30 text-xs"></i>
                            <input type="tel" id="phone" placeholder="9876543210" class="bg-transparent text-xs w-full text-white placeholder-indigo-200/20 focus:outline-none">
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-semibold text-indigo-200/60">Password</label>
                        <div class="flex items-center gap-3 glass border border-white/5 px-3 py-2 rounded-xl">
                            <i class="fas fa-lock text-indigo-300/30 text-xs"></i>
                            <input type="password" id="password" required minlength="6" placeholder="At least 6 chars" class="bg-transparent text-xs w-full text-white placeholder-indigo-200/20 focus:outline-none">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-full py-2.5 rounded-xl font-bold text-xs tracking-wide mt-2">
                        Create Account
                    </button>
                </form>

                <p class="text-center text-xs text-indigo-200/40">
                    Already have an account? <a href="login.html" class="text-indigo-400 font-semibold hover:underline">Sign In</a>
                </p>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        let selectedRole = 'CUSTOMER';

        document.addEventListener('DOMContentLoaded', () => {
            initNavbar();
            initFooter();
            redirectIfLoggedIn();

            const tabCust = document.getElementById('tab-cust');
            const tabSell = document.getElementById('tab-sell');

            tabCust.addEventListener('click', () => {
                selectedRole = 'CUSTOMER';
                tabCust.className = "py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-xl transition";
                tabSell.className = "py-2 text-xs font-semibold rounded-lg text-indigo-200 hover:text-white transition";
            });

            tabSell.addEventListener('click', () => {
                selectedRole = 'SELLER';
                tabSell.className = "py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-xl transition";
                tabCust.className = "py-2 text-xs font-semibold rounded-lg text-indigo-200 hover:text-white transition";
            });

            const regForm = document.getElementById('register-form');
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value;

                showLoadingSpinner();
                try {
                    const res = await API.register({ name, email, phone, password, role: selectedRole });
                    
                    saveAuthData(res.data.token, res.data.refreshToken, {
                        id: res.data.id,
                        name: res.data.name,
                        email: res.data.email,
                        role: res.data.role,
                        profileImage: res.data.profileImage
                    });

                    showToast('Registration successful! Verification email sent.', 'success');
                    setTimeout(() => {
                        if (res.data.role === 'SELLER') {
                            window.location.href = 'seller-dashboard.html';
                        } else {
                            window.location.href = 'customer-dashboard.html';
                        }
                    }, 1500);

                } catch (error) {
                    // API request methods trigger failure toast
                } finally {
                    hideLoadingSpinner();
                }
            });
        });
    </script>
</body>
</html>
