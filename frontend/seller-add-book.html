<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book — Re-Leaf Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { indigo: { 50:'#f5f4ff',100:'#ebe9ff',200:'#dcd8ff',300:'#c5beff',400:'#a79eff',500:'#877aff',600:'#6c63ff',700:'#5c52e6',800:'#4c42c2',900:'#3e379e' } } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="min-h-screen flex flex-col bg-[#0F0F1A]">
    <nav id="navbar"></nav>
    <main class="flex-grow pt-24 pb-12">
        <div class="max-w-2xl mx-auto px-4">
            <div class="flex items-center gap-3 mb-8">
                <a href="seller-dashboard.html" class="text-indigo-400 hover:text-indigo-300 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-3xl font-extrabold text-white">Add New Book</h1>
            </div>

            <form id="add-book-form" class="glass p-8 rounded-2xl border border-white/5 flex flex-col gap-5">
                
                <!-- Book Images Preview -->
                <div>
                    <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider block mb-2">Cover Image URL</label>
                    <div class="flex gap-3 items-start">
                        <div class="w-24 h-32 rounded-xl bg-white/5 border border-white/5 overflow-hidden shrink-0 flex items-center justify-center" id="img-preview">
                            <i class="fas fa-image text-indigo-200/20 text-2xl"></i>
                        </div>
                        <div class="flex-grow flex flex-col gap-2">
                            <input type="url" id="book-image" name="image" placeholder="https://..." class="input-glass w-full" oninput="previewImage(this.value)">
                            <p class="text-[10px] text-indigo-200/30">Paste a URL to your book cover. Ideally 3:4 ratio.</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2 flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Title *</label>
                        <input type="text" id="book-title" name="title" required placeholder="e.g., The Midnight Library" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Author *</label>
                        <input type="text" id="book-author" name="author" required placeholder="e.g., Matt Haig" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">ISBN</label>
                        <input type="text" id="book-isbn" name="isbn" placeholder="978-..." class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Publisher</label>
                        <input type="text" id="book-publisher" name="publisher" placeholder="e.g., Penguin Books" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Published Year</label>
                        <input type="number" id="book-year" name="publishedYear" placeholder="2021" min="1900" max="2025" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Language</label>
                        <input type="text" id="book-language" name="language" placeholder="English" class="input-glass w-full" value="English">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Pages</label>
                        <input type="number" id="book-pages" name="pageCount" placeholder="350" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Genre *</label>
                        <select id="book-genre" name="genre" required class="input-glass w-full">
                            <option value="">Select genre</option>
                            <option>Fiction</option><option>Non-Fiction</option><option>Mystery</option>
                            <option>Thriller</option><option>Romance</option><option>Science Fiction</option>
                            <option>Fantasy</option><option>Biography</option><option>Self-Help</option>
                            <option>Business</option><option>Technology</option><option>History</option>
                            <option>Philosophy</option><option>Children</option><option>Education</option><option>Other</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Condition *</label>
                        <select id="book-condition" name="condition" required class="input-glass w-full">
                            <option value="">Select condition</option>
                            <option value="LIKE_NEW">Like New — Barely used</option>
                            <option value="VERY_GOOD">Very Good — Minor signs of use</option>
                            <option value="GOOD">Good — Some wear, fully readable</option>
                            <option value="ACCEPTABLE">Acceptable — Visible wear</option>
                            <option value="POOR">Poor — Heavy wear</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Original MRP (₹) *</label>
                        <input type="number" id="book-mrp" name="mrp" required placeholder="599" min="1" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Selling Price (₹) *</label>
                        <input type="number" id="book-price" name="price" required placeholder="249" min="1" class="input-glass w-full" oninput="updateDiscount()">
                    </div>
                    <div class="flex flex-col gap-1.5 sm:col-span-2">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Description</label>
                        <textarea id="book-description" name="description" rows="4" placeholder="Tell buyers about the book's condition, highlights, why you're selling..." class="input-glass w-full resize-none"></textarea>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Quantity</label>
                        <input type="number" id="book-quantity" name="quantity" value="1" min="1" max="10" class="input-glass w-full">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-indigo-200/50 font-semibold uppercase tracking-wider">Negotiable?</label>
                        <select id="book-negotiable" name="negotiable" class="input-glass w-full">
                            <option value="false">No</option>
                            <option value="true">Yes, open to offers</option>
                        </select>
                    </div>
                </div>

                <!-- Discount preview -->
                <div id="discount-preview" class="hidden glass px-4 py-2 rounded-xl border border-emerald-500/20 text-xs text-emerald-400 flex items-center gap-2">
                    <i class="fas fa-tag"></i>
                    <span id="discount-text"></span>
                </div>

                <div class="flex gap-4 pt-2">
                    <a href="seller-dashboard.html" class="btn-outline py-3 px-8 rounded-xl font-bold text-sm flex-1 text-center">Cancel</a>
                    <button type="submit" class="btn-primary py-3 px-8 rounded-xl font-bold text-sm flex-1 flex items-center justify-center gap-2" id="submit-btn">
                        <i class="fas fa-plus-circle text-xs"></i> List Book
                    </button>
                </div>
            </form>
        </div>
    </main>
    <footer id="footer"></footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        function previewImage(url) {
            const preview = document.getElementById('img-preview');
            if (url) {
                preview.innerHTML = `<img src="${url}" class="w-full h-full object-cover" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fas fa-image text-indigo-200/20 text-2xl\\'></i>'">`;
            } else {
                preview.innerHTML = '<i class="fas fa-image text-indigo-200/20 text-2xl"></i>';
            }
        }

        function updateDiscount() {
            const mrp = parseFloat(document.getElementById('book-mrp').value) || 0;
            const price = parseFloat(document.getElementById('book-price').value) || 0;
            const preview = document.getElementById('discount-preview');
            const text = document.getElementById('discount-text');
            if (mrp > 0 && price > 0 && mrp > price) {
                const pct = Math.round(((mrp - price) / mrp) * 100);
                text.textContent = `Buyers save ${pct}% off the original MRP!`;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
        }

        document.getElementById('add-book-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const imgUrl = document.getElementById('book-image').value.trim();

            const bookData = {
                title: document.getElementById('book-title').value.trim(),
                author: document.getElementById('book-author').value.trim(),
                isbn: document.getElementById('book-isbn').value.trim(),
                publisher: document.getElementById('book-publisher').value.trim(),
                publishedYear: parseInt(document.getElementById('book-year').value) || null,
                language: document.getElementById('book-language').value.trim() || 'English',
                pageCount: parseInt(document.getElementById('book-pages').value) || null,
                genre: document.getElementById('book-genre').value,
                condition: document.getElementById('book-condition').value,
                mrp: parseFloat(document.getElementById('book-mrp').value),
                price: parseFloat(document.getElementById('book-price').value),
                description: document.getElementById('book-description').value.trim(),
                quantity: parseInt(document.getElementById('book-quantity').value) || 1,
                negotiable: document.getElementById('book-negotiable').value === 'true',
                images: imgUrl ? [imgUrl] : []
            };

            if (!bookData.title || !bookData.author || !bookData.genre || !bookData.condition || !bookData.price || !bookData.mrp) {
                showToast('Please fill in all required fields', 'warning'); return;
            }
            if (bookData.price > bookData.mrp) {
                showToast('Selling price cannot be higher than MRP', 'warning'); return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> Listing...';
            showLoadingSpinner();

            try {
                await API.createBook(bookData);
                hideLoadingSpinner();
                showToast('📚 Book listed successfully!', 'success');
                setTimeout(() => window.location.href = 'seller-dashboard.html', 1500);
            } catch(err) {
                hideLoadingSpinner();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus-circle text-xs"></i> List Book';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            requireAuth(['SELLER', 'ADMIN']);
            initNavbar();
            initFooter();
        });
    </script>

    <style>
        .input-glass {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.75rem;
            padding: 0.625rem 0.875rem;
            color: #fff;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-glass:focus { border-color: rgba(108,99,255,0.4); }
        .input-glass::placeholder { color: rgba(165,148,255,0.2); }
        select.input-glass option { background: #1a1a2e; }
    </style>
</body>
</html>
