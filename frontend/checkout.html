<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Re-Leaf Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { indigo: { 50:'#f5f4ff',100:'#ebe9ff',200:'#dcd8ff',300:'#c5beff',400:'#a79eff',500:'#877aff',600:'#6c63ff',700:'#5c52e6',800:'#4c42c2',900:'#3e379e' } } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="min-h-screen flex flex-col bg-[#0F0F1A]">
    <nav id="navbar"></nav>

    <main class="flex-grow pt-24 pb-12">
        <div class="max-w-5xl mx-auto px-4">
            <h1 class="text-3xl font-extrabold text-white mb-2">Checkout</h1>

            <!-- Step Indicator -->
            <div class="flex items-center gap-2 mb-10 text-xs">
                <div class="flex items-center gap-1.5" id="step-1-indicator">
                    <div class="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">1</div>
                    <span class="font-semibold text-white">Address</span>
                </div>
                <div class="flex-grow h-px bg-white/10"></div>
                <div class="flex items-center gap-1.5" id="step-2-indicator">
                    <div class="w-6 h-6 rounded-full bg-white/10 text-indigo-200/40 flex items-center justify-center font-bold text-xs" id="step2-circle">2</div>
                    <span class="text-indigo-200/40 font-semibold" id="step2-label">Payment</span>
                </div>
                <div class="flex-grow h-px bg-white/10"></div>
                <div class="flex items-center gap-1.5" id="step-3-indicator">
                    <div class="w-6 h-6 rounded-full bg-white/10 text-indigo-200/40 flex items-center justify-center font-bold text-xs" id="step3-circle">3</div>
                    <span class="text-indigo-200/40 font-semibold" id="step3-label">Confirm</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Main Form Area -->
                <div class="lg:col-span-2">

                    <!-- Step 1: Delivery Address -->
                    <div id="step-1" class="glass p-8 rounded-2xl border border-white/5 flex flex-col gap-5">
                        <h3 class="font-bold text-white text-lg border-b border-white/5 pb-3">Delivery Address</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2 flex flex-col gap-1.5">
                                <label class="text-xs text-indigo-200/50">Street Address</label>
                                <input type="text" id="addr-street" placeholder="House No., Street, Area" class="glass px-3 py-2.5 rounded-xl text-sm text-white bg-transparent border-white/10 placeholder-indigo-200/20 focus:outline-none w-full">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-indigo-200/50">City</label>
                                <input type="text" id="addr-city" placeholder="Mumbai" class="glass px-3 py-2.5 rounded-xl text-sm text-white bg-transparent border-white/10 placeholder-indigo-200/20 focus:outline-none w-full">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-indigo-200/50">State</label>
                                <input type="text" id="addr-state" placeholder="Maharashtra" class="glass px-3 py-2.5 rounded-xl text-sm text-white bg-transparent border-white/10 placeholder-indigo-200/20 focus:outline-none w-full">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-indigo-200/50">Pincode</label>
                                <input type="text" id="addr-pincode" placeholder="400001" class="glass px-3 py-2.5 rounded-xl text-sm text-white bg-transparent border-white/10 placeholder-indigo-200/20 focus:outline-none w-full" maxlength="6">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs text-indigo-200/50">Country</label>
                                <input type="text" id="addr-country" value="India" class="glass px-3 py-2.5 rounded-xl text-sm text-white bg-transparent border-white/10 focus:outline-none w-full">
                            </div>
                        </div>
                        <button onclick="goToStep(2)" class="btn-primary py-3 px-8 rounded-xl font-bold text-sm self-end">Continue to Payment →</button>
                    </div>

                    <!-- Step 2: Payment Method -->
                    <div id="step-2" class="hidden glass p-8 rounded-2xl border border-white/5 flex flex-col gap-5">
                        <h3 class="font-bold text-white text-lg border-b border-white/5 pb-3">Payment Method</h3>
                        <div class="grid grid-cols-1 gap-3" id="payment-options">
                            <label class="flex items-center gap-4 glass border border-white/5 p-4 rounded-xl cursor-pointer hover:border-indigo-400 transition" id="pay-upi">
                                <input type="radio" name="paymentMethod" value="UPI" class="accent-indigo-500"> 
                                <div class="flex items-center gap-2"><span class="text-xl">📱</span><div><p class="font-bold text-sm text-white">UPI</p><p class="text-xs text-indigo-200/40">Google Pay, PhonePe, Paytm</p></div></div>
                            </label>
                            <label class="flex items-center gap-4 glass border border-white/5 p-4 rounded-xl cursor-pointer hover:border-indigo-400 transition">
                                <input type="radio" name="paymentMethod" value="CREDIT_CARD" class="accent-indigo-500">
                                <div class="flex items-center gap-2"><span class="text-xl">💳</span><div><p class="font-bold text-sm text-white">Credit Card</p><p class="text-xs text-indigo-200/40">Visa, Mastercard, Amex</p></div></div>
                            </label>
                            <label class="flex items-center gap-4 glass border border-white/5 p-4 rounded-xl cursor-pointer hover:border-indigo-400 transition">
                                <input type="radio" name="paymentMethod" value="DEBIT_CARD" class="accent-indigo-500">
                                <div class="flex items-center gap-2"><span class="text-xl">💳</span><div><p class="font-bold text-sm text-white">Debit Card</p><p class="text-xs text-indigo-200/40">All major banks supported</p></div></div>
                            </label>
                            <label class="flex items-center gap-4 glass border border-white/5 p-4 rounded-xl cursor-pointer hover:border-indigo-400 transition">
                                <input type="radio" name="paymentMethod" value="NET_BANKING" class="accent-indigo-500">
                                <div class="flex items-center gap-2"><span class="text-xl">🏦</span><div><p class="font-bold text-sm text-white">Net Banking</p><p class="text-xs text-indigo-200/40">All major banks</p></div></div>
                            </label>
                            <label class="flex items-center gap-4 glass border border-white/5 p-4 rounded-xl cursor-pointer hover:border-indigo-400 transition">
                                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" class="accent-indigo-500">
                                <div class="flex items-center gap-2"><span class="text-xl">💵</span><div><p class="font-bold text-sm text-white">Cash on Delivery</p><p class="text-xs text-indigo-200/40">Pay when your order arrives</p></div></div>
                            </label>
                        </div>
                        <div class="flex gap-3 justify-between">
                            <button onclick="goToStep(1)" class="btn-outline py-3 px-8 rounded-xl font-bold text-sm">← Back</button>
                            <button onclick="goToStep(3)" class="btn-primary py-3 px-8 rounded-xl font-bold text-sm">Review Order →</button>
                        </div>
                    </div>

                    <!-- Step 3: Confirm Order -->
                    <div id="step-3" class="hidden glass p-8 rounded-2xl border border-white/5 flex flex-col gap-5">
                        <h3 class="font-bold text-white text-lg border-b border-white/5 pb-3">Review & Confirm</h3>
                        <div id="confirm-summary" class="flex flex-col gap-3 text-xs"></div>
                        <div class="flex gap-3 justify-between mt-4">
                            <button onclick="goToStep(2)" class="btn-outline py-3 px-8 rounded-xl font-bold text-sm">← Back</button>
                            <button onclick="placeOrder()" id="place-order-btn" class="btn-primary py-3 px-8 rounded-xl font-bold text-sm shadow-xl flex items-center gap-2">
                                <i class="fas fa-lock text-xs"></i> Place Order Securely
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right: Order Summary -->
                <div class="glass p-6 rounded-2xl border border-white/5 flex flex-col gap-4 self-start">
                    <h3 class="font-bold text-sm text-white border-b border-white/5 pb-3">Order Summary</h3>
                    <div id="checkout-items" class="flex flex-col gap-3 text-xs"></div>
                    <hr class="border-white/5">
                    <div class="flex flex-col gap-2 text-xs">
                        <div class="flex justify-between text-indigo-200/50"><span>Subtotal</span><span id="co-subtotal" class="text-white">₹0</span></div>
                        <div class="flex justify-between text-indigo-200/50"><span>GST (18%)</span><span id="co-gst" class="text-white">₹0</span></div>
                        <div class="flex justify-between text-indigo-200/50"><span>Shipping</span><span id="co-shipping" class="text-white">₹0</span></div>
                        <hr class="border-white/5">
                        <div class="flex justify-between font-bold text-sm text-white"><span>Total</span><span id="co-total" class="text-indigo-400 text-lg">₹0</span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/checkout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initNavbar();
            initFooter();
            initCheckoutPage();
        });
    </script>
</body>
</html>
