<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Re-Leaf Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { indigo: { 50:'#f5f4ff',100:'#ebe9ff',200:'#dcd8ff',300:'#c5beff',400:'#a79eff',500:'#877aff',600:'#6c63ff',700:'#5c52e6',800:'#4c42c2',900:'#3e379e' } } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .float-anim { animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#0F0F1A] overflow-hidden relative">
    
    <!-- Background glow blobs -->
    <div class="absolute w-96 h-96 bg-indigo-600/10 rounded-full blur-[100px] top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute w-72 h-72 bg-purple-600/10 rounded-full blur-[80px] bottom-1/4 right-1/4"></div>

    <div class="text-center px-4 relative z-10">
        <!-- Giant 404 -->
        <div class="float-anim">
            <h1 class="text-[10rem] sm:text-[14rem] font-black leading-none" style="
                background: linear-gradient(135deg, #6c63ff, #a79eff, #6c63ff);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                filter: drop-shadow(0 0 60px rgba(108,99,255,0.3));
            ">404</h1>
        </div>

        <div class="text-6xl -mt-8 mb-4">📚</div>
        <h2 class="text-2xl font-bold text-white mb-2">Page Not Found</h2>
        <p class="text-indigo-200/40 text-sm mb-8 max-w-sm mx-auto">
            Looks like this page went out of print. It might have been moved, deleted, or maybe it never existed.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="index.html" class="btn-primary py-3 px-8 rounded-xl font-bold">
                <i class="fas fa-home mr-2"></i> Go Home
            </a>
            <a href="books.html" class="btn-outline py-3 px-8 rounded-xl font-bold">
                <i class="fas fa-book mr-2"></i> Browse Books
            </a>
        </div>

        <p class="text-indigo-200/20 text-xs mt-10">
            Error Code: 404 · Not Found
        </p>
    </div>
</body>
</html>
