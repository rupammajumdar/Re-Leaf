<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — Re-Leaf Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { indigo: { 50:'#f5f4ff',100:'#ebe9ff',200:'#dcd8ff',300:'#c5beff',400:'#a79eff',500:'#877aff',600:'#6c63ff',700:'#5c52e6',800:'#4c42c2',900:'#3e379e' } } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="min-h-screen flex flex-col bg-[#0F0F1A]">
    <nav id="navbar"></nav>
    <main class="flex-grow pt-24 pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-extrabold text-white">My Wishlist</h1>
                    <p class="text-indigo-200/40 text-sm mt-1">Books you've saved for later</p>
                </div>
                <a href="books.html" class="btn-outline py-2 px-5 rounded-xl text-sm">Browse More</a>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="wishlist-grid">
                <!-- Dynamically populated -->
            </div>
        </div>
    </main>
    <footer id="footer"></footer>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        async function initWishlistPage() {
            requireAuth(['CUSTOMER']);
            const grid = document.getElementById('wishlist-grid');
            
            // Skeleton
            grid.innerHTML = Array(4).fill().map(() => `<div class="glass p-4 rounded-2xl flex flex-col gap-3"><div class="aspect-[3/4] skeleton rounded-xl"></div><div class="h-4 skeleton w-3/4"></div><div class="h-3 skeleton w-1/2"></div></div>`).join('');

            try {
                const res = await API.getWishlist();
                const books = res.data.books || [];
                if (books.length === 0) {
                    grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center gap-4 py-20 text-center"><span class="text-6xl">💝</span><h3 class="font-bold text-white text-xl">Your wishlist is empty</h3><p class="text-xs text-indigo-200/40 max-w-xs">Browse books and click the heart icon to save them here</p><a href="books.html" class="btn-primary py-2 px-6 rounded-xl text-sm mt-2">Browse Books</a></div>`;
                    return;
                }
                grid.innerHTML = books.map(book => {
                    const img = book.images && book.images.length ? book.images[0] : 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=400&h=500';
                    return `<div class="glass-card overflow-hidden flex flex-col group">
                        <div class="relative overflow-hidden aspect-[3/4] bg-white/5 rounded-xl">
                            <img src="${img}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 cursor-pointer" onclick="window.location.href='book-detail.html?id=${book.id}'">
                            ${getConditionBadge(book.condition) ? `<div class="absolute top-3 left-3">${getConditionBadge(book.condition)}</div>` : ''}
                        </div>
                        <div class="p-3 flex flex-col gap-2">
                            <h4 class="font-bold text-sm text-indigo-100 truncate cursor-pointer hover:text-indigo-400 transition" onclick="window.location.href='book-detail.html?id=${book.id}'">${book.title}</h4>
                            <p class="text-xs text-indigo-200/40">by ${book.author}</p>
                            <div class="flex justify-between items-center mt-1">
                                <span class="font-bold text-white">${formatPrice(book.finalPrice)}</span>
                                <div class="flex gap-2">
                                    <button onclick="moveToCart('${book.id}')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white py-1 px-3 rounded-lg transition">Cart</button>
                                    <button onclick="removeWishlistItem('${book.id}')" class="text-xs text-red-400/60 hover:text-red-400 transition"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch(e) {
                grid.innerHTML = `<p class="col-span-full text-center py-12 text-red-400">Error loading wishlist</p>`;
            }
        }

        async function removeWishlistItem(bookId) {
            try {
                await API.removeFromWishlist(bookId);
                showToast('Removed from wishlist', 'info');
                initWishlistPage();
            } catch(e) {}
        }

        async function moveToCart(bookId) {
            showLoadingSpinner();
            try {
                await API.moveToCart(bookId);
                showToast('Moved to cart!', 'success');
                initWishlistPage();
            } catch(e) {}
            hideLoadingSpinner();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initNavbar();
            initFooter();
            initWishlistPage();
        });
    </script>
</body>
</html>
